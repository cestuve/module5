<div class="app" id="app">
<header class="hud hidden" id="courseHud" aria-label="Course menu"><button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false">Menu ▾</button><div class="menu hidden" id="sceneMenu" aria-hidden="true"></div></header>
<main id="mainContent" tabindex="-1"></main>
<div class="modal-backdrop hidden" id="modalBackdrop" role="dialog" aria-modal="true" aria-hidden="true"><div class="modal" id="modalPanel"><button class="close-btn" id="closeModal" aria-label="Close dialog">×</button><div id="modalContent"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div><div class="sr-only" id="srStatus" aria-live="polite"></div>
</div>
<script>(() => {
'use strict';
const BASE='https://cestuve.github.io/module5/';
const IMG={
 mariaFull:BASE+'Maria_Fullbody.png',mariaHead:BASE+'Maria_Headshot.png',
 juanitaFull:BASE+'Juanita_Fullbody.png',juanitaHead:BASE+'Juanita_Headshot.png',juanitaNeutral:BASE+'Juanita_Neutral.png',juanitaConcerned:BASE+'Juanita_Concerned.png',juanitaConcernedFull:BASE+'Juanita_Concerned_Fullbody.png',juanitaSpeaking:BASE+'Juanita_Speaking.png',
 kaiFull:BASE+'Kai_Fullbody.png',kaiHead:BASE+'Kai_Headshot.png',kaiNeutral:BASE+'Kai_Neutral.png',kaiConcerned:BASE+'Kai_Concerned.png',kaiMother:BASE+'Kai_Mother_Headshot.png',
 records:BASE+'Administrative_Records_Room.png',training:BASE+'Ethics_Training_Room.png',counseling:BASE+'Outpatient_Counseling_Office.png',frontDesk:BASE+'Front_Desk_Reception_Area.png',office:'https://cestuve.github.io/module2/Maria_Office.png',finalExterior:'https://cestuve.github.io/module1/BG-08.png'
};
const sections=[
 ['Week 5','Begin Ethics & Confidentiality'],['Ethical Principles','Core values that guide practice'],['Ethical Decisions','A systematic decision process'],['Social Media','Professional conduct online'],['Just Trying to Help','Juanita & Kai confidentiality case'],['Confidentiality','Trust and 42 CFR Part 2'],['Disclosure Rules','When information may be shared'],['HIPAA & Privacy','Protected information and breaches'],['Complete','Ethics, privacy, & professional responsibility']
];
const state={name:'',maxSection:0,currentSection:0,ethicsViewed:new Set(),stepsViewed:new Set(),exceptionsViewed:new Set(),socialIndex:0,privacyIndex:0,reflections:{ethics:'',social:'',confidentiality:'',privacy:''}};
const main=document.getElementById('mainContent'),hud=document.getElementById('courseHud'),menu=document.getElementById('sceneMenu'),menuToggle=document.getElementById('menuToggle'),modalBackdrop=document.getElementById('modalBackdrop'),modalContent=document.getElementById('modalContent'),closeModalBtn=document.getElementById('closeModal'),toast=document.getElementById('toast'),srStatus=document.getElementById('srStatus');
let lastFocus=null;
function esc(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}
function say(t){srStatus.textContent='';setTimeout(()=>srStatus.textContent=t,10)}
function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),2400)}
function showModal(html){lastFocus=document.activeElement;modalContent.innerHTML=html;modalBackdrop.classList.remove('hidden');modalBackdrop.setAttribute('aria-hidden','false');const h=modalContent.querySelector('h2,h1');if(h){h.id='modalTitle';modalBackdrop.setAttribute('aria-labelledby','modalTitle')}setTimeout(()=>{const first=modalContent.querySelector('button:not([disabled]),a,input,select,textarea');if(first)first.focus();else document.getElementById('modalPanel').focus?.()},20)}
function closeModal(){modalBackdrop.classList.add('hidden');modalBackdrop.setAttribute('aria-hidden','true');modalBackdrop.removeAttribute('aria-labelledby');if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}
function headQuote(img,name,text,alt=name){return `<div class="quote-card quote-with-headshot"><img src="${img}" alt="${esc(alt)}"><div><strong>${esc(name)}</strong><p>${text}</p></div></div>`}
function setSection(i){state.currentSection=i;state.maxSection=Math.max(state.maxSection,i);renderMenu()}
function renderMenu(){menu.innerHTML=sections.map((s,i)=>`<button class="menu-item" type="button" data-jump="${i}" ${i>state.maxSection?'disabled':''} ${i===state.currentSection?'aria-current="page"':''}>${i+1}. ${s[0]}<span>${s[1]}</span></button>`).join('')}
function dots(total,index){return `<div class="progress-dots" aria-label="Question ${index+1} of ${total}">${Array.from({length:total},(_,i)=>`<span class="progress-dot ${i<index?'done':i===index?'current':''}" aria-hidden="true"></span>`).join('')}</div>`}
menuToggle.addEventListener('click',e=>{e.stopPropagation();const open=menu.classList.toggle('hidden')===false;menuToggle.setAttribute('aria-expanded',open?'true':'false');menu.setAttribute('aria-hidden',open?'false':'true')});
document.addEventListener('click',e=>{if(!menu.contains(e.target)&&e.target!==menuToggle){menu.classList.add('hidden');menuToggle.setAttribute('aria-expanded','false');menu.setAttribute('aria-hidden','true')}});
closeModalBtn.addEventListener('click',closeModal);modalBackdrop.addEventListener('click',e=>{if(e.target===modalBackdrop)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modalBackdrop.classList.contains('hidden'))closeModal()});

function titleIntro(){hud.classList.add('hidden');main.innerHTML=`<section class="intro-scene"><div class="intro-panel"><span class="mini-label">Harbor Point · Module 5</span><h1>Ethics and Confidentiality</h1><div class="intro-rule"></div><p class="intro-lead">As a chemical dependency counselor assistant, your ethical responsibilities affect every interaction you have with clients.</p><p class="intro-copy">You are responsible for maintaining professional conduct, respecting client rights, and protecting private information.</p><p class="intro-copy">In this module, you’ll explore ethical decision-making, social media use, confidentiality, informed consent, exceptions to confidentiality, 42 CFR Part 2, and HIPAA.</p><p class="intro-copy">Understanding these responsibilities is essential for building trust, protecting clients, and practicing with integrity.</p><div class="button-row"><button class="primary-btn" data-action="begin-week5">Begin Module →</button></div></div></section>`}
function trainingScene(){hud.classList.remove('hidden');setSection(0);main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.training}')"><div class="scene-guide">Maria is ready to introduce this week’s work on ethics and confidentiality.</div><img class="character" src="${IMG.mariaFull}" alt="" style="left:50%;transform:translateX(-50%);bottom:-3%;height:68vh"><button class="character-hotspot" data-action="maria-intro" type="button" aria-label="Talk with Maria about Module 5" style="left:50%;transform:translateX(-50%);bottom:2%;width:29%;height:62%"></button></div></section>`}
function mariaIntro(){showModal(`<h2>Week 5 at Harbor Point</h2>${headQuote(IMG.mariaHead,'Maria','“Ethics and confidentiality are not separate from client care. They shape how we communicate, what we share, how we make decisions, and whether clients can trust us.”','Maria, Harbor Point supervisor')}<p>This week you’ll move between ethical principles, digital professionalism, confidentiality rules, and realistic privacy decisions. Some situations will have an obvious answer. Others will require you to slow down, consult guidance, and think about possible consequences.</p><div class="field"><label for="learnerName">Your name</label><input id="learnerName" type="text" value="${esc(state.name)}" placeholder="Enter your name for the reflection PDF"></div><div class="button-row center"><button class="primary-btn" data-action="show-objectives">See What You’ll Learn →</button></div>`) }
function objectives(){showModal(`<h2>What You’ll Learn</h2><div class="objective-grid"><div class="objective-card"><strong>Ethical Principles</strong><span>Understand principles that guide CDCA practice.</span></div><div class="objective-card"><strong>Ethical Decision-Making</strong><span>Use a systematic process when the answer is not obvious.</span></div><div class="objective-card"><strong>Confidentiality</strong><span>Understand why protecting client information is ethical and legal.</span></div><div class="objective-card"><strong>Disclosure Exceptions</strong><span>Recognize situations in which information may be shared.</span></div><div class="objective-card"><strong>HIPAA & Social Media</strong><span>Identify privacy risks in digital and everyday practice.</span></div></div><div class="button-row center"><button class="primary-btn" data-action="go-ethics">Start With Ethical Principles →</button></div>`) }

const principles=[
 {icon:'🧭',name:'Autonomy',definition:'Respecting an individual’s right to make decisions about their own life and care',practice:'In practice: Give clients meaningful choices and respect their right to participate in decisions about their care.'},
 {icon:'🌱',name:'Beneficence',definition:'Acting in ways that promote the well-being of others and provide benefit',practice:'In practice: Ask what action is most likely to support the client’s well-being.'},
 {icon:'🛡️',name:'Non-Maleficence',definition:'Avoiding actions that could cause unnecessary harm; this principle is often summarized as “do no harm”',practice:'In practice: Consider how a decision could harm a client, even when your intention is to help.'},
 {icon:'⚖️',name:'Justice',definition:'Promoting fairness and equality in treatment, responsibilities, and access to resources',practice:'In practice: Apply standards fairly and consider whether clients have equitable access to care and support.'},
 {icon:'🤝',name:'Fidelity',definition:'Being trustworthy, keeping commitments, and honoring the responsibilities of the professional relationship',practice:'In practice: Follow through on professional responsibilities and protect the trust clients place in you.'}

async function downloadPDF(){const prompts=[

 ['Protecting Privacy in Practice','Think about the privacy risks you reviewed in this module. What is one practice you will be especially careful about in your future work, and why do you think it will be important?',state.reflections.privacy]
 ];
 const safe=(state.name||'Learner').replace(/[^a-z0-9_-]+/gi,'_').replace(/^_+|_+$/g,'')||'Learner';const pageW=1275,pageH=1650,margin=92,contentW=pageW-margin*2;const pages=[];let canvas,ctx,y;
 const makePage=()=>{canvas=document.createElement('canvas');canvas.width=pageW;canvas.height=pageH;ctx=canvas.getContext('2d');ctx.fillStyle='#faf6ef';ctx.fillRect(0,0,pageW,pageH);ctx.fillStyle='#243746';ctx.fillRect(0,0,pageW,166);ctx.fillStyle='#d7a74a';ctx.fillRect(0,166,pageW,10);ctx.fillStyle='#fff';ctx.font='700 38px Inter, Arial, sans-serif';ctx.fillText('Ethics and Confidentiality',margin,76);ctx.font='600 22px Inter, Arial, sans-serif';ctx.fillStyle='#dce9ee';ctx.fillText('Harbor Point · Module 5 Reflection Report',margin,128);y=232;ctx.fillStyle='#354f5c';ctx.font='700 23px Inter, Arial, sans-serif';ctx.fillText(`Learner: ${state.name||'Learner'}`,margin,y);y+=34;ctx.font='500 19px Inter, Arial, sans-serif';ctx.fillText(`Completed: ${new Date().toLocaleDateString()} ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`,margin,y);y+=58;};
 const wrap=(text,font,maxWidth)=>{ctx.font=font;const words=(text||'No response recorded.').toString().split(/\s+/);const lines=[];let line='';for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);return lines};
 const add=async()=>{await new Promise(r=>canvas.toBlob(b=>{pages.push(b);r()},'image/jpeg',.9))};
 makePage();for(const [title,prompt,response] of prompts){const t=wrap(title,'800 25px Inter, Arial, sans-serif',contentW-48),p=wrap(prompt,'700 19px Inter, Arial, sans-serif',contentW-48),r=wrap(response,'500 21px Inter, Arial, sans-serif',contentW-48);const boxH=38+t.length*33+12+p.length*28+18+r.length*31+32;if(y+boxH>pageH-90){await add();makePage()}ctx.fillStyle='#fffdfa';roundRect(ctx,margin,y,contentW,boxH,20,true,false);ctx.strokeStyle='#dfd5c7';ctx.lineWidth=3;roundRect(ctx,margin,y,contentW,boxH,20,false,true);let yy=y+38;ctx.fillStyle='#243746';ctx.font='800 25px Inter, Arial, sans-serif';t.forEach(line=>{ctx.fillText(line,margin+24,yy);yy+=33});yy+=4;ctx.fillStyle='#496173';ctx.font='700 19px Inter, Arial, sans-serif';p.forEach(line=>{ctx.fillText(line,margin+24,yy);yy+=28});yy+=10;ctx.fillStyle='#263238';ctx.font='500 21px Inter, Arial, sans-serif';r.forEach(line=>{ctx.fillText(line,margin+24,yy);yy+=31});y+=boxH+24}await add();const imgs=[];for(const b of pages)imgs.push(new Uint8Array(await b.arrayBuffer()));const bytes=buildPDF(imgs,pageW,pageH);const blob=new Blob([bytes],{type:'application/pdf'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`CDCA_Module5_Reflections_${safe}.pdf`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);showToast('Your Module 5 PDF has been downloaded.');say('Your Module 5 reflection report has been downloaded.')}
function roundRect(c,x,y,w,h,r,fill,stroke){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();if(fill)c.fill();if(stroke)c.stroke()}
function buildPDF(images,pageW,pageH){const enc=new TextEncoder(),chunks=[],offsets=[0];let length=0;const pt=t=>{const b=enc.encode(t);chunks.push(b);length+=b.length},pb=b=>{chunks.push(b);length+=b.length};pt('%PDF-1.4\n%PDFIMG\n');const objCount=2+images.length*3,pageRefs=[];const obj=(n,w)=>{offsets[n]=length;pt(`${n} 0 obj\n`);w();pt('\nendobj\n')};images.forEach((img,i)=>{const po=3+i*3,co=4+i*3,io=5+i*3;pageRefs.push(`${po} 0 R`);obj(po,()=>pt(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /XObject << /Im${i+1} ${io} 0 R >> >> /Contents ${co} 0 R >>`));const content=`q\n612 0 0 792 0 0 cm\n/Im${i+1} Do\nQ\n`,cb=enc.encode(content);obj(co,()=>{pt(`<< /Length ${cb.length} >>\nstream\n`);pb(cb);pt('endstream')});obj(io,()=>{pt(`<< /Type /XObject /Subtype /Image /Width ${pageW} /Height ${pageH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`);pb(img);pt('\nendstream')})});obj(1,()=>pt('<< /Type /Catalog /Pages 2 0 R >>'));obj(2,()=>pt(`<< /Type /Pages /Kids [${pageRefs.join(' ')}] /Count ${images.length} >>`));const xref=length;pt(`xref\n0 ${objCount+1}\n0000000000 65535 f \n`);for(let i=1;i<=objCount;i++)pt(String(offsets[i]||0).padStart(10,'0')+' 00000 n \n');pt(`trailer\n<< /Size ${objCount+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);const total=chunks.reduce((n,b)=>n+b.length,0),out=new Uint8Array(total);let pos=0;for(const b of chunks){out.set(b,pos);pos+=b.length}return out}
